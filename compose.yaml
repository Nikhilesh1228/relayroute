name: relayroute

services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://relayroute:relayroute@postgres:5432/relayroute
      REDIS_URL: redis://redis:6379/0
      MONGODB_URL: mongodb://mongo:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: local-development-secret-change-in-production
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      mongo: {condition: service_started}
      kafka: {condition: service_healthy}

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: relayroute
      POSTGRES_USER: relayroute
      POSTGRES_PASSWORD: relayroute
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relayroute -d relayroute"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  mongo:
    image: mongo:8.0
    volumes: ["mongo-data:/data/db"]

  kafka:
    image: bitnami/kafka:3.9
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
    volumes: ["kafka-data:/bitnami/kafka"]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  mongo-data:
  kafka-data:

